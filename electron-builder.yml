appId: com.huangquan.agent
productName: Acheron-Agent
directories:
  output: release-build
  buildResources: resources
artifactName: Acheron-Agent-${version}.exe
publish:
  provider: github
  owner: ATchangan
  repo: Acheron-agent
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/**/*        # 必须含 resources/**: 人设 ishiki.md 与图标
# v0.4.5: MemoryCore 记忆网关 sidecar —— 以 extraResources 带出(不进 asar, 供 ELECTRON_RUN_AS_NODE 拉起)
extraResources:
  - from: vendor/memory-core
    to: vendor/memory-core
    filter:
      - "**/*"
      - "!__tests__/**"
      - "!coverage/**"
      - "!*.test.ts"
electronLanguages:
  - zh-CN
win:
  target:
    - nsis
  icon: resources/icon.png   # electron-builder 自动由 512 PNG 生成多尺寸 .ico(黄泉立绘)
  # 无证书自动跳过签名; 需要签名时配置 signtoolOptions/azureSignOptions(E4), 绝不要写 signAndEditExecutable: false(会丢失图标/版本信息)
mac:
  target:
    - dmg
  icon: resources/icon.png
linux:
  target:
    - AppImage
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Acheron-agent
  createDesktopShortcut: true
  include: installer.nsh    # 安装时默认展开详情面板(ShowInstDetails show)
