appId: com.huangquan.agent
productName: Acheron-Agent
directories:
  output: release
  buildResources: resources
artifactName: Acheron-Agent-${version}.exe
publish:
  provider: github
  owner: ATchangan
  repo: Acheron-agent
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/**/*        # SOP红线: 必须含 resources/**,否则人设 ishiki.md + 4 组技能不进包
electronLanguages:
  - zh-CN
win:
  target:
    - nsis
  icon: resources/icon.png   # electron-builder 自动由 512 PNG 生成多尺寸 .ico(黄泉立绘)
  # 无证书自动跳过签名; 需要签名时配置 signtoolOptions/azureSignOptions(E4), 绝不要写 signAndEditExecutable: false(会丢失图标/版本信息)
mac:
  target:
    - dmg
  icon: resources/icon.png
linux:
  target:
    - AppImage
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Acheron-agent
  createDesktopShortcut: true
  include: installer.nsh    # 安装时默认展开详情面板(ShowInstDetails show)
