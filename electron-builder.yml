appId: com.huangquan.agent
productName: 黄泉Agent
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/**/*
artifactName: Acheron-agent-${version}.exe
win:
  target:
    - nsis
  icon: resources/icon.ico
  sign: null
mac:
  target:
    - dmg
  icon: resources/icon.png
linux:
  target:
    - AppImage
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 黄泉Agent
  createDesktopShortcut: true
