appId: com.huangquan.agent
productName: 黄泉Agent
directories:
  output: release
  buildResources: resources
artifactName: Acheron-agent-${version}.exe
files:
  - dist/**/*
  - dist-electron/**/*
  - resources/**/*        # SOP红线: 必须含 resources/**,否则人设 ishiki.md + 4 组技能不进包
  - pet/**/*              # v0.4.0 M9: 桌宠静态页(透明置顶小窗), 关闭设置时零开销
win:
  target:
    - nsis
  icon: resources/icon.ico
  sign: null              # 无证书自动跳过签名; 绝不要写 signAndEditExecutable: false(会丢失图标/版本信息)
mac:
  target:
    - dmg
  icon: resources/icon.png
linux:
  target:
    - AppImage
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 黄泉Agent
  createDesktopShortcut: true
  include: installer.nsh    # 安装时默认展开详情面板(ShowInstDetails show)
